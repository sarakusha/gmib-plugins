name: Release plugin

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: target
        run: node scripts/release-target.mjs "$GITHUB_REF_NAME"
      - run: pnpm validate
      - run: pnpm build -- --plugin "${{ steps.target.outputs.id }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ID: ${{ steps.target.outputs.id }}
          PLUGIN_NAME: ${{ steps.target.outputs.name }}
          PLUGIN_VERSION: ${{ steps.target.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/$PLUGIN_ID.gmib-plugin"
          --verify-tag
          --title "$PLUGIN_NAME $PLUGIN_VERSION"
          --generate-notes
